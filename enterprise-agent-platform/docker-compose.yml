version: '3.8'

services:
  # 向量数据库：Qdrant (用于 RAG 混合检索)
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: agent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: always

  # 状态持久化与记忆数据库：Redis
  redis:
    image: redis:7.2-alpine
    container_name: agent_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    restart: always

  # 后端 Agent 服务 API
  agent-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=http://host.docker.internal:8001/v1  # 指向本地 vLLM API
      - LLM_API_KEY=EMPTY
    depends_on:
      - qdrant
      - redis
    restart: always